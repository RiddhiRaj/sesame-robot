<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .panel { fill: #151d31; stroke: #46516d; stroke-width: 3; }
      .panel-power { fill: #241b2b; stroke: #ff6b7a; stroke-width: 3; }
      .panel-control { fill: #132438; stroke: #55b9ff; stroke-width: 3; }
      .title { fill: #f7f9ff; font: 700 42px sans-serif; }
      .subtitle { fill: #aebbd2; font: 22px sans-serif; }
      .box-title { fill: #ffffff; font: 700 28px sans-serif; }
      .label { fill: #edf2ff; font: 22px sans-serif; }
      .small { fill: #b8c4dc; font: 18px sans-serif; }
      .tiny { fill: #aebbd2; font: 16px sans-serif; }
      .danger { fill: #ff7b88; font: 700 20px sans-serif; }
      .red { stroke: #ff5d73; fill: none; stroke-width: 7; }
      .ground { stroke: #c7cfdd; fill: none; stroke-width: 7; }
      .logic { stroke: #b88cff; fill: none; stroke-width: 5; }
      .data { stroke: #50c7ff; fill: none; stroke-width: 5; }
      .usb { stroke: #63e6be; fill: none; stroke-width: 5; stroke-dasharray: 13 9; }
      .optional { stroke-dasharray: 14 10; }
      .node { fill: #0b1020; stroke: #70809f; stroke-width: 2; }
      .map-row { fill: #10192b; stroke: #36435e; stroke-width: 1.5; }
    </style>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ff5d73"/>
    </marker>
    <marker id="arrow-ground" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c7cfdd"/>
    </marker>
    <marker id="arrow-logic" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b88cff"/>
    </marker>
    <marker id="arrow-data" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#50c7ff"/>
    </marker>
    <marker id="arrow-usb" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#63e6be"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1220"/>
  <text class="title" x="70" y="70">Sesame: Waveshare ESP32-S3-Zero + PCA9685 (NO OLED)</text>
  <text class="subtitle" x="70" y="108">Exact bench wiring • regulated 5.0 V servo rail • all grounds common</text>

  <!-- Power source -->
  <rect class="panel-power" x="70" y="180" width="280" height="180" rx="18"/>
  <text class="box-title" x="105" y="225">DC SOURCE</text>
  <text class="label" x="105" y="270">Battery or adapter</text>
  <text class="small" x="105" y="305">Voltage must fit the</text>
  <text class="small" x="105" y="332">buck input rating</text>
  <circle cx="350" cy="235" r="8" fill="#ff5d73"/>
  <circle cx="350" cy="315" r="8" fill="#c7cfdd"/>
  <text class="small" x="318" y="225">+</text>
  <text class="small" x="318" y="307">−</text>

  <!-- Fuse/switch -->
  <rect class="panel" x="420" y="190" width="210" height="100" rx="16"/>
  <text class="box-title" x="449" y="231">FUSE</text>
  <text class="small" x="449" y="261">then switch</text>

  <!-- Buck -->
  <rect class="panel-power" x="700" y="155" width="350" height="265" rx="18"/>
  <text class="box-title" x="744" y="202">5 V BUCK CONVERTER</text>
  <rect class="node" x="714" y="225" width="125" height="48" rx="8"/>
  <rect class="node" x="714" y="305" width="125" height="48" rx="8"/>
  <rect class="node" x="911" y="225" width="125" height="48" rx="8"/>
  <rect class="node" x="911" y="305" width="125" height="48" rx="8"/>
  <text class="label" x="737" y="257">VIN+</text>
  <text class="label" x="737" y="337">VIN−</text>
  <text class="label" x="937" y="257">5 V</text>
  <text class="label" x="930" y="337">GND</text>
  <text class="small" x="743" y="388">≥3 A repo minimum; 5 A preferred</text>

  <path class="red" d="M350 235 H420" marker-end="url(#arrow-red)"/>
  <path class="red" d="M630 235 H714" marker-end="url(#arrow-red)"/>
  <path class="ground" d="M350 315 H665 V329 H714" marker-end="url(#arrow-ground)"/>
  <text class="small" x="455" y="335">source negative</text>

  <!-- PCA -->
  <rect class="panel-control" x="1240" y="145" width="490" height="650" rx="18"/>
  <text class="box-title" x="1282" y="193">PCA9685 SERVO DRIVER</text>
  <text class="small" x="1282" y="221">I²C address 0x40 • 50 Hz later in firmware</text>

  <rect class="node" x="1240" y="245" width="172" height="43" rx="7"/>
  <rect class="node" x="1240" y="305" width="172" height="43" rx="7"/>
  <rect class="node" x="1240" y="390" width="172" height="43" rx="7"/>
  <rect class="node" x="1240" y="450" width="172" height="43" rx="7"/>
  <rect class="node" x="1240" y="510" width="172" height="43" rx="7"/>
  <rect class="node" x="1240" y="570" width="172" height="43" rx="7"/>
  <text class="label" x="1262" y="274">V+ (servo 5 V)</text>
  <text class="label" x="1262" y="334">GND</text>
  <text class="label" x="1262" y="419">VCC (logic)</text>
  <text class="label" x="1262" y="479">OE</text>
  <text class="label" x="1262" y="539">SDA</text>
  <text class="label" x="1262" y="599">SCL</text>

  <text class="label" x="1450" y="265">Servo channels</text>
  <g>
    <rect class="map-row" x="1450" y="282" width="230" height="42" rx="5"/><text class="small" x="1470" y="309">CH0  →  R1</text>
    <rect class="map-row" x="1450" y="327" width="230" height="42" rx="5"/><text class="small" x="1470" y="354">CH1  →  R2</text>
    <rect class="map-row" x="1450" y="372" width="230" height="42" rx="5"/><text class="small" x="1470" y="399">CH2  →  L1</text>
    <rect class="map-row" x="1450" y="417" width="230" height="42" rx="5"/><text class="small" x="1470" y="444">CH3  →  L2</text>
    <rect class="map-row" x="1450" y="462" width="230" height="42" rx="5"/><text class="small" x="1470" y="489">CH4  →  R4</text>
    <rect class="map-row" x="1450" y="507" width="230" height="42" rx="5"/><text class="small" x="1470" y="534">CH5  →  R3</text>
    <rect class="map-row" x="1450" y="552" width="230" height="42" rx="5"/><text class="small" x="1470" y="579">CH6  →  L3</text>
    <rect class="map-row" x="1450" y="597" width="230" height="42" rx="5"/><text class="small" x="1470" y="624">CH7  →  L4</text>
  </g>
  <text class="small" x="1450" y="675">CH8–CH15: leave empty</text>
  <text class="tiny" x="1450" y="708">Servo plug: brown/black = GND</text>
  <text class="tiny" x="1450" y="733">red = V+ • orange/yellow/white = signal</text>
  <text class="tiny" x="1450" y="758">Follow the board’s printed G / V+ / PWM rows.</text>

  <!-- Buck to PCA power -->
  <path class="red" d="M1036 249 H1165 V266 H1240" marker-end="url(#arrow-red)"/>
  <path class="ground" d="M1036 329 H1185 V326 H1240" marker-end="url(#arrow-ground)"/>
  <text class="small" x="1062" y="232">heavy 5 V</text>
  <text class="small" x="1062" y="359">heavy GND</text>

  <!-- ESP -->
  <rect class="panel-control" x="700" y="610" width="350" height="410" rx="18"/>
  <text class="box-title" x="738" y="660">WAVESHARE</text>
  <text class="box-title" x="738" y="695">ESP32-S3-ZERO</text>
  <rect class="node" x="910" y="720" width="126" height="42" rx="7"/>
  <rect class="node" x="910" y="775" width="126" height="42" rx="7"/>
  <rect class="node" x="910" y="840" width="126" height="42" rx="7"/>
  <rect class="node" x="910" y="895" width="126" height="42" rx="7"/>
  <rect class="node" x="910" y="950" width="126" height="42" rx="7"/>
  <rect class="node" x="714" y="825" width="155" height="54" rx="8"/>
  <text class="label" x="941" y="748">5V</text>
  <text class="label" x="932" y="803">GND</text>
  <text class="label" x="927" y="868">3V3</text>
  <text class="label" x="922" y="923">GPIO8</text>
  <text class="label" x="914" y="978">GPIO9</text>
  <text class="small" x="735" y="859">USB-C (flash)</text>
  <text class="tiny" x="736" y="913">GPIO8 = SDA</text>
  <text class="tiny" x="736" y="940">GPIO9 = SCL</text>
  <text class="tiny" x="736" y="980">NO OLED connected</text>

  <!-- Logic/data connections -->
  <path class="logic" d="M1036 861 H1130 V411 H1240" marker-end="url(#arrow-logic)"/>
  <path class="data" d="M1036 916 H1160 V531 H1240" marker-end="url(#arrow-data)"/>
  <path class="data" d="M1036 971 H1200 V591 H1240" marker-end="url(#arrow-data)"/>
  <path class="ground" d="M1036 796 H1090 V470 H1240" marker-end="url(#arrow-ground)"/>
  <text class="small" x="1060" y="847" fill="#b88cff">3.3 V logic only</text>
  <text class="small" x="1070" y="904">SDA</text>
  <text class="small" x="1070" y="962">SCL</text>
  <text class="small" x="1098" y="495">OE tied LOW</text>

  <!-- Standalone power branch -->
  <path class="red optional" d="M1120 249 V560 H1090 V741 H1036" marker-end="url(#arrow-red)"/>
  <path class="ground" d="M1185 329 V585 H1110 V796 H1036" marker-end="url(#arrow-ground)"/>
  <text class="small" x="870" y="570">STANDALONE ONLY: buck 5 V → ESP 5V (GND stays connected in both modes)</text>

  <!-- PC USB test mode -->
  <rect class="panel" x="70" y="745" width="470" height="245" rx="18"/>
  <text class="box-title" x="108" y="795">USB PROGRAMMING / FIRST TEST</text>
  <text class="label" x="108" y="840">Computer USB-C → Waveshare USB-C</text>
  <text class="small" x="108" y="880">Keep buck → ESP 5V branch disconnected.</text>
  <text class="small" x="108" y="912">Keep PCA/servo power from the buck.</text>
  <text class="small" x="108" y="944">Grounds must still be common.</text>
  <path class="usb" d="M540 852 H714" marker-end="url(#arrow-usb)"/>

  <!-- Safety footer -->
  <rect x="70" y="1065" width="1660" height="105" rx="16" fill="#2a1520" stroke="#ff5d73" stroke-width="3"/>
  <text class="danger" x="105" y="1105">NEVER: raw battery → ESP 5V • servo V+ → PCA VCC • servos → ESP 3V3 • USB and external ESP 5V together</text>
  <text class="small" x="105" y="1142">Set the buck to 5.0 V with a multimeter before connecting boards. Use the PCA screw terminal for V+/GND if present.</text>
  <text class="small" x="105" y="1195">Buck USB-C / barrel jack: do not use until the exact module confirms whether each connector is an input or output.</text>
</svg>
